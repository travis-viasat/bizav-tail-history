name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tail-history/package-lock.json

      - name: Install dependencies
        working-directory: tail-history
        run: npm ci

      - name: Build
        working-directory: tail-history
        # BUILD_BASE must match the sub-path where Pages serves this project.
        # For a user/org repo it is typically /tail-history/ — adjust if needed.
        env:
          BUILD_BASE: /tail-history/
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tail-history/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
